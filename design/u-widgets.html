<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeenWay · U · Виджеты</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #3a1c71, #d76d77 55%, #ffaf7b); color: #fff; font: 15px/1.4 system-ui, sans-serif; padding: 34px 20px 120px; }
.grid { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 150px; gap: 16px; }
.w { border-radius: 30px; background: #ffffff2b; backdrop-filter: blur(20px); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 30px #0002; }
.w2 { grid-column: span 2; } .w4 { grid-column: span 4; } .tall { grid-row: span 2; }
.lbl { font-size: 13px; opacity: .85; font-weight: 600; }
.huge { font-size: 44px; font-weight: 800; line-height: 1; }
.status { background: #ffffffe6; color: #2b1450; }
.status .huge { color: #16a34a; font-size: 34px; }
.modes { display: flex; flex-direction: column; gap: 8px; }
.modes b { padding: 10px 14px; border-radius: 16px; background: #ffffff22; font-weight: 600; }
.modes b.on { background: #fff; color: #3a1c71; }
.ring { width: 86px; height: 86px; border-radius: 50%; background: conic-gradient(#fff 0 9%, #ffffff33 9%); display: grid; place-items: center; align-self: center; }
.ring div { width: 64px; height: 64px; border-radius: 50%; background: #c06c84; display: grid; place-items: center; font-weight: 800; }
.icons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.icons span { font-size: 22px !important; border-radius: 12px !important; }
.icons span { aspect-ratio: 1; border-radius: 18px; background: #ffffff33; display: grid; place-items: center; font-size: 28px; }
.icons span.off { opacity: .4; }
.dock { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 14px; padding: 12px 18px; border-radius: 30px; background: #ffffff33; backdrop-filter: blur(20px); }
.dock span { width: 54px; height: 54px; border-radius: 16px; background: #fff; color: #3a1c71; display: grid; place-items: center; font-size: 26px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } .w4 { grid-column: span 2; } }
</style></head><body>
<div class="grid">
  <div class="w w2 status"><span class="lbl">KeenWay</span><div class="huge">Защищено</div><span class="lbl">🇸🇪 Швеция 287220</span></div>
  <div class="w"><span class="lbl">Пинг</span><div class="huge">53</div><span class="lbl">мс</span></div>
  <div class="w"><span class="lbl">Подписка</span><div class="huge">24</div><span class="lbl">дня</span></div>
  <div class="w w2 tall"><span class="lbl">Режим</span><div class="modes"><b class="on">🚀 Auto-Best</b><b>🛡️ Fallback</b><b>⚙️ Manual</b></div><span class="lbl">Сам берёт лучший сервер</span></div>
  <div class="w w2"><span class="lbl">Трафик</span><div class="ring"><div>9%</div></div></div>
  <div class="w w2"><span class="lbl">Через VPN</span><div class="icons"><span>▶️</span><span>💬</span><span>📷</span><span>✈️</span><span class="off">🏦</span><span class="off">🎮</span></div></div>
</div>
<div class="dock"><span>🏠</span><span>🌍</span><span>🧩</span><span>📱</span><span>⚙️</span></div>
</body></html>
