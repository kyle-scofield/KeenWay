<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeenWay · вариант C · Как мобильное приложение</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 30px 16px; background: #f2f3f7; color: #15171c; font: 15px/1.5 system-ui, sans-serif; }
.phone { width: 380px; max-width: 100%; background: #fff; border-radius: 36px; padding: 26px 22px 30px; box-shadow: 0 30px 80px #0f17402e; }
.top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 20px; }
.top b { color: #5b54e8; }
.gear { width: 38px; height: 38px; border-radius: 12px; background: #f2f3f7; display: grid; place-items: center; }
.power { margin: 34px auto 14px; width: 190px; height: 190px; border-radius: 50%; padding: 10px; background: conic-gradient(#5b54e8, #22c1a0, #5b54e8); }
.power div { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 54px; }
.state { text-align: center; font-weight: 700; font-size: 19px; }
.state small { display: block; color: #22a07f; font-size: 14px; font-weight: 600; margin-top: 4px; }
.server { margin-top: 26px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #f6f6fa; }
.server .f { font-size: 28px; }
.server .t { flex: 1; } .server .t b { display: block; } .server .t span { color: #6b7080; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { padding: 8px 12px; border-radius: 99px; background: #eef0ff; color: #4a43d4; font-weight: 600; font-size: 13px; }
.chip.off { background: #f1f2f5; color: #8a8f9c; }
.sub { margin-top: 18px; font-size: 13px; color: #6b7080; }
.sb { height: 6px; border-radius: 99px; background: #eceef4; margin-top: 6px; }
.sb i { display: block; height: 100%; width: 9%; border-radius: 99px; background: #5b54e8; }
</style>
</head>
<body>
<div class="phone">
  <div class="top"><span>Keen<b>Way</b></span><div class="gear">⚙</div></div>
  <div class="power"><div>⏻</div></div>
  <div class="state">Подключено<small>● всё работает · 53 мс</small></div>
  <div class="server"><div class="f">🇸🇪</div><div class="t"><b>Швеция 287220</b><span>Авто-выбор лучшего сервера</span></div><div>›</div></div>
  <div class="chips">
    <span class="chip">YouTube</span><span class="chip">Discord</span><span class="chip">Instagram</span><span class="chip">Telegram</span><span class="chip off">Банки — напрямую</span>
  </div>
  <div class="sub">Подписка VPNN: осталось 24 дня · 28 из 3221 ГБ<div class="sb"><i></i></div></div>
</div>
</body>
</html>
