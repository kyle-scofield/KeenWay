<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeenWay · Пульт с ручкой</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2b2d31; font: 14px/1.4 system-ui, sans-serif; color: #e6e6e6; padding: 20px; }
.dev { width: 860px; max-width: 100%; background: linear-gradient(180deg, #3a3d42, #2c2e33); border-radius: 22px; padding: 26px 30px; box-shadow: 0 30px 60px #0008, inset 0 1px 0 #ffffff22; display: grid; grid-template-columns: 1fr 260px 1fr; gap: 26px; align-items: center; }
.screen { background: #0d1a10; border-radius: 10px; padding: 14px; font: 13px/1.6 ui-monospace, monospace; color: #7dff9b; box-shadow: inset 0 3px 10px #000a; text-shadow: 0 0 6px #7dff9b88; }
.screen b { color: #b6ffc5; }
.knobwrap { text-align: center; position: relative; height: 260px; }
.labels span { position: absolute; font-weight: 700; font-size: 12px; letter-spacing: .06em; color: #9a9da3; }
.labels .on { color: #ffb347; text-shadow: 0 0 10px #ffb347; }
.knob { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6b6f76, #2a2c30 70%); box-shadow: 0 12px 24px #000a, inset 0 2px 2px #ffffff33; transform: rotate(-45deg); }
.knob::after { content: ''; position: absolute; left: 50%; top: 12px; width: 6px; height: 28px; margin-left: -3px; border-radius: 3px; background: #ffb347; box-shadow: 0 0 10px #ffb347; }
.brand { position: absolute; bottom: -4px; left: 0; right: 0; font-weight: 800; letter-spacing: .3em; font-size: 12px; color: #9a9da3; }
.leds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.led { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.led i { width: 14px; height: 14px; border-radius: 50%; background: #39ff7a; box-shadow: 0 0 10px #39ff7a, inset 0 -2px 3px #0005; }
.led.off i { background: #4a4d52; box-shadow: inset 0 -2px 3px #0005; }
.sw { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 8px; }
.sw b { flex: 1; text-align: center; padding: 10px 0; border-radius: 8px; background: linear-gradient(180deg, #4a4d52, #36383d); box-shadow: 0 3px 0 #1d1e21; font-size: 12px; }
@media (max-width: 760px) { .dev { grid-template-columns: 1fr; } }
</style></head><body>
<div class="dev">
  <div class="screen">KEENWAY v0.0.4<br>───────────────<br>СТАТУС: <b>ЗАЩИЩЕНО</b><br>СЕРВЕР: <b>SE-287220</b><br>ПИНГ:   <b>53 ms</b><br>ПОДПИСКА: <b>24 дн</b><br>ТРАФИК: <b>28/3221 GB</b></div>
  <div class="knobwrap">
    <div class="labels"><span class="on" style="left:18px;top:30px">AUTO-BEST</span><span style="right:22px;top:30px">FALLBACK</span><span style="left:50%;bottom:22px;transform:translateX(-50%)">MANUAL</span></div>
    <div class="knob"></div>
    <div class="brand">РЕЖИМ</div>
  </div>
  <div class="leds">
    <div class="led"><i></i>YouTube</div><div class="led"><i></i>Discord</div>
    <div class="led"><i></i>Instagram</div><div class="led"><i></i>Telegram</div>
    <div class="led off"><i></i>Банки</div><div class="led off"><i></i>Игры</div>
    <div class="sw"><b>ПИНГ</b><b>СЕРВЕРЫ</b><b>НАСТР.</b></div>
  </div>
</div>
</body></html>
