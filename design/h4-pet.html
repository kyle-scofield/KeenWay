<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeenWay · 4 · Питомец-роутер</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #b8e0d2; font: 15px/1.4 "Press Start 2P", ui-monospace, monospace; color: #1f3b2c; padding: 20px; }
.egg { width: 420px; max-width: 100%; background: linear-gradient(160deg, #ff9eb5, #f472b6); border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; padding: 60px 40px 46px; box-shadow: inset -10px -14px 0 #db2777aa, 0 20px 40px #0003; }
.lcd { background: #9bbc0f; border: 6px solid #6b8a0a; border-radius: 12px; padding: 16px; image-rendering: pixelated; box-shadow: inset 0 0 0 2px #8bac0f; }
.name { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.pet { font-size: 76px; text-align: center; line-height: 1.1; margin: 8px 0; filter: grayscale(1) contrast(1.4) brightness(.6) sepia(1) hue-rotate(40deg); }
.say { text-align: center; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.meter { display: grid; grid-template-columns: 90px 1fr; gap: 4px 8px; font-size: 12px; align-items: center; }
.meter .h { letter-spacing: 2px; }
.btns { display: flex; justify-content: space-between; margin-top: 22px; }
.btn { text-align: center; font-size: 11px; font-weight: 700; color: #4a0e2b; }
.btn i { display: block; width: 52px; height: 52px; margin: 0 auto 6px; border-radius: 50%; background: #ffe066; box-shadow: 0 5px 0 #c9a227; display: grid; place-items: center; font-style: normal; font-size: 22px; }
.btn.on i { background: #fff; box-shadow: 0 2px 0 #c9a227; transform: translateY(3px); }
</style></head><body>
<div class="egg"><div class="lcd">
  <div class="name"><span>РОУТИК</span><span>24 ДНЯ</span></div>
  <div class="pet">🐣</div>
  <div class="say">«Мне хорошо! Я в Швеции 🇸🇪»</div>
  <div class="meter">
    <span>Настроение</span><span class="h">♥♥♥♥♥</span>
    <span>Скорость</span><span class="h">■■■■□ 53мс</span>
    <span>Сытость</span><span class="h">■□□□□ 28ГБ</span>
    <span>Друзья</span><span class="h">YT DC IG TG</span>
  </div>
</div>
<div class="btns"><div class="btn on"><i>🚀</i>САМ</div><div class="btn"><i>🛡️</i>ДЕРЖИСЬ</div><div class="btn"><i>⚙️</i>Я САМ</div></div>
</div>
</body></html>
