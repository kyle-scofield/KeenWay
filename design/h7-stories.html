<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeenWay · 7 · Сторис роутера</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #000; color: #fff; font: 15px/1.4 system-ui, sans-serif; display: grid; place-items: center; padding: 20px; }
.phone { width: 380px; max-width: 100%; height: 700px; max-height: calc(100vh - 40px); border-radius: 34px; overflow: hidden; position: relative; background: linear-gradient(170deg, #f97316, #db2777 50%, #7c3aed); }
.prog { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 4px; }
.prog i { flex: 1; height: 3px; border-radius: 2px; background: #ffffff55; } .prog i.done { background: #fff; } .prog i.now { background: linear-gradient(90deg, #fff 60%, #ffffff55 60%); }
.who { position: absolute; top: 28px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; }
.av { width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #db2777; display: grid; place-items: center; font-weight: 800; border: 2px solid #fde047; }
.who b { display: block; font-size: 14px; } .who span { font-size: 12px; opacity: .8; }
.x { margin-left: auto; font-size: 22px; }
.content { position: absolute; inset: 90px 22px 150px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.big { font-size: 80px; } .content h2 { font-size: 34px; margin: 10px 0; line-height: 1.1; }
.sticker { display: inline-block; background: #fff; color: #111; font-weight: 800; padding: 8px 14px; border-radius: 12px; transform: rotate(-4deg); margin: 6px auto 0; }
.poll { position: absolute; left: 22px; right: 22px; bottom: 76px; background: #ffffffee; color: #111; border-radius: 18px; padding: 12px; }
.poll b { display: block; text-align: center; margin-bottom: 8px; font-size: 14px; }
.poll div { display: flex; gap: 6px; } .poll span { flex: 1; text-align: center; padding: 9px 4px; border-radius: 12px; background: #f1f1f1; font-weight: 700; font-size: 13px; }
.poll span.on { background: linear-gradient(90deg, #f97316, #db2777); color: #fff; }
.reply { position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; gap: 10px; }
.reply div { flex: 1; border: 1px solid #ffffff99; border-radius: 99px; padding: 10px 16px; font-size: 14px; opacity: .9; } .reply span { font-size: 24px; }
</style></head><body>
<div class="phone">
  <div class="prog"><i class="done"></i><i class="done"></i><i class="now"></i><i></i></div>
  <div class="who"><div class="av">K</div><div><b>роутик</b><span>5 мин назад</span></div><span class="x">✕</span></div>
  <div class="content"><div class="big">🇸🇪</div><h2>Я теперь в Швеции!</h2><div>YouTube и Discord снова работают</div><div class="sticker">⚡ 53 мс</div><div class="sticker" style="transform:rotate(3deg)">📅 ещё 24 дня</div></div>
  <div class="poll"><b>Как мне выбирать сервер?</b><div><span class="on">🚀 Сам</span><span>🛡️ Один</span><span>⚙️ Я выберу</span></div></div>
  <div class="reply"><div>Ответить роутику…</div><span>❤️</span></div>
</div>
</body></html>
