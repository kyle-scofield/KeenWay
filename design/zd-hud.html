.corner { position: absolute; padding: 18px 22px; }

.slot i { font-style: normal; font-size: 24px; }
.slot kbd { position: absolute; top: 3px; left: 5px; font: 11px ui-monospace, monospace; color: #6fa8c7; }
.slot.on { border-color: #fbbf24; box-shadow: 0 0 18px #fbbf24aa, inset 0 0 14px #fbbf2455; color: #fde68a; }
