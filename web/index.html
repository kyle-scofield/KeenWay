<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeenWay</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav">
  <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><div>Keen<span>Way</span></div></div>
  <button data-page="overview">🏠 Обзор</button>
  <button data-page="keys">🔑 Подключение</button>
  <button data-page="services">🧩 Сервисы</button>
  <button data-page="sites">🌐 Свои сайты</button>
  <button data-page="devices">💻 Устройства</button>
  <button data-page="servers">🛰 Серверы</button>
  <button data-page="traffic">📊 Трафик</button>
  <button data-page="logs">📜 Логи</button>
  <button data-page="settings">⚙️ Настройки</button>
  <div class="spacer"></div>
  <button class="update-btn" id="updateBtn" hidden></button>
  <a class="donate" id="donateBtn" href="#" role="button">💜 Поддержать</a>
  <div class="router-state" id="routerState"></div>
</nav>
<main><div class="wrap" id="page"></div></main>
<div class="applybar" id="applybar" hidden>
  <div class="grow" id="applyText"><strong>Есть неприменённые изменения.</strong> <span class="muted small">Они вступят в силу после применения на роутере.</span></div>
  <button class="btn" id="previewBtn">Посмотреть конфиг</button>
  <button class="btn" id="dryBtn">Проверить</button>
  <button class="btn primary" id="applyBtn">Применить на роутере</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
